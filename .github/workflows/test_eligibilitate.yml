# Experiment (24.11.2026): cât din lanțul „convocare BDNS → documente → beneficiari → baze” se face automat, fără model de limbaj.
# Rezultatul: ramura `test-eligibilitate` (citibilă din sesiuni fără acces la artefacte). Nu publică release-uri.
name: test_eligibilitate
on:
  workflow_dispatch:
    inputs:
      n:
        description: "Mărimea eșantionului"
        default: "300"
      seed:
        description: "Sămânța eșantionului"
        default: "42"

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pyarrow requests && sudo apt-get install -y -qq poppler-utils
      - name: Testul
        env:
          N: ${{ inputs.n }}
          SEED: ${{ inputs.seed }}
          OUT: /tmp/out
        run: python experimente/eligibilitate/test.py
      - name: Rezultatul pe ramura test-eligibilitate
        if: always()
        run: |
          git init -q r && cd r
          git config user.name "test-bot" && git config user.email "github-actions[bot]@users.noreply.github.com"
          cp -r /tmp/out/. . 2>/dev/null || echo "fără rezultate" > LIPSA.txt
          git add -A && git commit -qm "test_eligibilitate n=${{ inputs.n }} seed=${{ inputs.seed }}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:test-eligibilitate
