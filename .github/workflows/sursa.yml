name: sursa

# La cerere: o sursă anume (sursa) sau toate sursele cu `descarcare: actions` (sursa goală).
# Săptămânal: paznicul – toate sursele din Actions (fără cele cu `saptamanal: false`); motorul se oprește singur dacă amprenta e aceeași.
on:
  workflow_dispatch:
    inputs:
      sursa:
        description: "Sursa (folderul din surse/); gol = toate sursele din Actions"
        required: false
        default: ""
      forteaza:
        description: "Publică și dacă amprenta e aceeași"
        type: boolean
        default: false
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: write
  issues: write

concurrency:
  group: munca-sursa
  cancel-in-progress: false

jobs:
  ruleaza:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: osmium (sursele OSM)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq osmium-tool
      - name: Motorul
        id: motor
        env:
          SURSA: ${{ inputs.sursa }}
          FORTEAZA: ${{ inputs.forteaza && '--forteaza' || '' }}
        run: |
          if [ -n "$SURSA" ]; then
            surse="$SURSA"
          else
            surse=$(python - <<'EOF'
          import yaml, pathlib
          for p in sorted(pathlib.Path('surse').glob('*/sursa.yaml')):
              if not p.parent.name.startswith('_') and (c := yaml.safe_load(p.read_text()))['descarcare'] == 'actions' and c.get('saptamanal', True):
                  print(p.parent.name)
          EOF
          )
          fi
          esec=0
          for s in $surse; do
            echo "::group::$s"
            python -m comun.motor "$s" $FORTEAZA || esec=1
            echo "::endgroup::"
          done
          echo "esec=$esec" >> "$GITHUB_OUTPUT"
      - name: Starea în depozit
        if: always()
        run: |
          git config user.name "munca-bot"
          git config user.email "munca-bot@users.noreply.github.com"
          git add stare/ || true
          if ! git diff --cached --quiet; then
            git commit -m "stare: rularea ${{ github.run_id }}"
            for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
          fi
      - name: Rezultat
        if: steps.motor.outputs.esec == '1'
        run: exit 1
